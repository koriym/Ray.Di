name: Mutation Testing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  infection:
    name: Infection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: mbstring

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify infection installed
        run: |
          ls -la vendor/bin/infection || echo "infection not found"
          php -v
          php -m | grep -i pcov || echo "pcov not loaded"

      - name: Create build directory
        run: mkdir -p build/coverage-xml

      - name: Generate coverage
        run: |
          php -d pcov.enabled=1 vendor/bin/phpunit --testsuite "Ray.Di Test Suite" --coverage-xml=build/coverage-xml --log-junit=build/coverage-xml/junit.xml

      - name: Run Infection
        run: |
          vendor/bin/infection --coverage=build/coverage-xml --threads=4 --logger-github --min-msi=0 --min-covered-msi=0 --skip-initial-tests --no-progress
        env:
          INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}

      - name: Upload mutation testing results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-results
          path: |
            build/infection.json
            build/infection.log
            build/infection-summary.log
            build/infection.html
          retention-days: 30
